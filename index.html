<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Writing Sessions</title>
<meta name="description" content="Immersive writing sprints with slow cinematic scenes, ambience and chimes.">
<meta name="theme-color" content="#0d0e0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Writing Sessions">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="app">
  <section id="view-library" class="view"></section>
  <section id="view-settings" class="view" hidden></section>
  <section id="view-request" class="view" hidden></section>
</main>
<nav class="tabs" aria-label="Main">
  <button data-tab="library" class="on"><span>◈</span>Library</button>
  <button data-tab="settings"><span>⚙︎</span>Settings</button>
  <button data-tab="request"><span>✎</span>Request</button>
</nav>
<div id="sheet" class="sheet" hidden></div>
<div id="player" hidden></div>
<noscript><p style="padding:2rem">Writing Sessions needs JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
