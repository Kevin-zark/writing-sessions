<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Theme preview · Writing Sessions</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/app.css">
<style>
 body{background:#0d0e0c;color:#e9e3d6;margin:0;font-family:-apple-system,system-ui,sans-serif}
 .pv{max-width:900px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px 120px}
 .pv h1{font-family:Georgia,serif;font-weight:400;margin:.3em 0}.pv small,.muted{color:#9a9282}
 .screen{position:sticky;top:0;z-index:5;background:#000;aspect-ratio:16/9;border-radius:10px;overflow:hidden;margin:8px 0}
 .screen video,.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
 .screen .cap{position:absolute;left:10px;bottom:8px;font-size:.8rem;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:6px}
 .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
 button{background:#2a2620;color:#e9e3d6;border:1px solid #4a4236;border-radius:8px;padding:8px 12px;font-size:.9rem}
 button.on{background:#d9b26f;color:#111}
 .leg{margin-top:18px}.leg h2{font-family:Georgia,serif;font-weight:400;font-size:1.15rem;margin:.2em 0;color:#d9b26f}
 .row{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:8px;border-bottom:1px solid #26231e;align-items:start}
 .row img{width:88px;aspect-ratio:16/9;object-fit:cover;border-radius:5px}
 .row b{font-weight:600}.tag{display:inline-block;font-size:.72rem;border:1px solid #4a4236;border-radius:10px;padding:1px 7px;margin:2px 3px 0 0;color:#cfc6b3}
 .tag.br{border-color:#6b5a3a;color:#d9b26f}
 textarea{width:100%;box-sizing:border-box;background:#17150f;color:#e9e3d6;border:1px solid #3a342a;border-radius:6px;margin-top:6px;font-size:.85rem;min-height:2.4em}
 .mix{font-size:.78rem;color:#9a9282}
 table{border-collapse:collapse;font-size:.78rem;width:100%}td,th{border-bottom:1px solid #26231e;padding:3px 6px;text-align:left}
</style></head>
<body><div class="pv" id="pv"><p>Loading…</p></div>
<script type="module" src="js/preview.js"></script>
</body></html>
